name: Isolated image build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Provision the disposable rootless worker
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ca-certificates curl uidmap dbus-user-session slirp4netns
          sudo install -m 0755 -d /etc/apt/keyrings
          curl --fail --silent --show-error https://download.docker.com/linux/ubuntu/gpg | sudo tee /etc/apt/keyrings/docker.asc > /dev/null
          sudo chmod a+r /etc/apt/keyrings/docker.asc
          printf 'deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable\n' | sudo tee /etc/apt/sources.list.d/embermend-docker.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq docker-ce docker-ce-cli containerd.io docker-ce-rootless-extras docker-buildx-plugin
          builder_uid=$(id -u)
          builder_home=$(getent passwd "$builder_uid" | cut -d: -f6)
          test "$builder_uid" -ne 0
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$builder_uid.service"
          if ! env -i HOME="$builder_home" PATH=/usr/bin:/bin XDG_RUNTIME_DIR="/run/user/$builder_uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$builder_uid/bus" dockerd-rootless-setuptool.sh install --force; then
            sudo journalctl --no-pager "_UID=$builder_uid" -n 100
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/embermend-build/source" "$RUNNER_TEMP/embermend-build/output"
          cp -a "$GITHUB_WORKSPACE/." "$RUNNER_TEMP/embermend-build/source/"
          chmod 0755 "$RUNNER_TEMP/embermend-build/source"
      - name: Independently validate and build without write credentials
        shell: bash
        run: |
          set -euo pipefail
          builder_uid=$(id -u)
          builder_home=$(getent passwd "$builder_uid" | cut -d: -f6)
          builder_root="$RUNNER_TEMP/embermend-build"
          rootless() {
            env -i HOME="$builder_home" PATH=/usr/bin:/bin XDG_RUNTIME_DIR="/run/user/$builder_uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$builder_uid/bus" DOCKER_HOST="unix:///run/user/$builder_uid/docker.sock" "$@"
          }
          rootless docker info --format '{{json .SecurityOptions}}' | tee rootless-security.json
          node -e "const fs=require('node:fs'); const options=JSON.parse(fs.readFileSync('rootless-security.json')); if (!options.some(value=>value.includes('rootless'))) process.exit(1)"
          rootless docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 64 --memory 512m --cpus 1 --user 1000:1000 --workdir /source --mount "type=bind,source=$builder_root/source,target=/source,readonly" node:24.22.1-bookworm-slim@sha256:be8204d4bd327363357f532187b752ff62759c31bedf98e9e18fc08c9cbd605c node --test test/baseline.test.mjs test/security.test.mjs
          rootless docker buildx create --name acceptance-builder --driver docker-container --driver-opt memory=2g,cpu-quota=200000 --use --bootstrap
          rootless docker buildx build --builder acceptance-builder --network none --platform linux/amd64,linux/arm64 --build-arg "SOURCE_REVISION=$GITHUB_SHA" --attest type=provenance,mode=max --attest type=sbom,generator=docker.io/docker/buildkit-syft-scanner@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315 --output "type=oci,dest=$builder_root/output/image.oci.tar" "$builder_root/source"
          install -m 0644 "$builder_root/output/image.oci.tar" image.oci.tar
          sha256sum image.oci.tar > image.oci.tar.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: isolated-image
          path: |
            image.oci.tar
            image.oci.tar.sha256
            rootless-security.json
          retention-days: 14
          if-no-files-found: error
  attest:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: isolated-image
      - name: Verify the exact built artifact
        run: sha256sum --check image.oci.tar.sha256
      - name: Attest without checking out or executing repository code
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: image.oci.tar
